<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Drop</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d1117">
<link rel="manifest" href="/static/manifest.json">
<link rel="stylesheet" href="/static/xterm.min.css">
<link rel="stylesheet" href="/static/touchsel.css?v=3">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--dim:#8b949e;--accent:#58a6ff;--green:#3fb950;--red:#f85149}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);height:100dvh;height:100vh;display:flex;flex-direction:column;overflow:hidden;overscroll-behavior:none}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;border-bottom:1px solid var(--border);background:var(--bg);flex-shrink:0}
.hdr h1{font-size:16px;color:var(--accent);font-weight:600}
.hdr-right{display:flex;gap:8px;align-items:center}
.tabs{display:flex;gap:0;margin-left:16px}
.tab{padding:6px 16px;font-size:13px;cursor:pointer;color:var(--dim);border-bottom:2px solid transparent;transition:all .15s}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab:hover{color:var(--text)}
.panel{flex:1;overflow:hidden;display:none}
.panel.active{display:flex;flex-direction:column}
#drop-panel{overflow-y:auto;padding:16px}
#drop-panel .inner{max-width:1000px;margin:0 auto;width:100%}
.drop{border:2px dashed var(--border);border-radius:10px;padding:24px;text-align:center;color:var(--dim);cursor:pointer;transition:all .2s;margin-bottom:16px}
.drop.over{border-color:var(--accent);background:rgba(88,166,255,.05);color:var(--accent)}
.drop input{display:none}
.bar{height:4px;background:var(--border);border-radius:2px;margin-top:8px;overflow:hidden;display:none}
.bar.active{display:block}
.bar .fill{height:100%;background:var(--accent);transition:width .2s;width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.item{background:var(--card);border:1px solid var(--border);border-radius:8px;overflow:hidden;position:relative}
.item img{width:100%;aspect-ratio:1;object-fit:cover;display:block;cursor:pointer}
.item .placeholder{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--dim);background:var(--bg)}
.item .info{padding:8px;font-size:11px;overflow:hidden}
.item .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);font-weight:500}
.item .meta{color:var(--dim);margin-top:2px}
.item .dl{position:absolute;top:4px;right:40px;background:rgba(0,0,0,.7);color:var(--accent);font-size:18px;width:32px;height:32px;border-radius:50%;cursor:pointer;display:none;align-items:center;justify-content:center;text-decoration:none}
.item .del{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.7);border:none;color:var(--red);font-size:18px;width:32px;height:32px;border-radius:50%;cursor:pointer;display:none;align-items:center;justify-content:center}
.item .share{position:absolute;top:4px;right:76px;background:rgba(0,0,0,.7);border:none;color:var(--green);font-size:18px;width:32px;height:32px;border-radius:50%;cursor:pointer;display:none;align-items:center;justify-content:center}
.item:hover .dl,.item:hover .del,.item:hover .share{display:flex}
@media(hover:none){.item .dl,.item .del,.item .share{display:flex}}
.empty{text-align:center;color:var(--dim);padding:40px;font-size:14px}
.count{font-size:12px;color:var(--dim)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--green);color:#000;padding:8px 20px;border-radius:20px;font-size:13px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;z-index:99}
.toast.show{opacity:1}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:100;display:none;align-items:center;justify-content:center;cursor:pointer}
.lightbox img{max-width:95vw;max-height:95vh;border-radius:8px}
.lightbox.on{display:flex}
#term-panel{background:#000;overflow:hidden;overscroll-behavior:none}
#term-tabs{display:flex;align-items:center;background:#010409;border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto;-webkit-overflow-scrolling:touch}
#term-tabs .tt{padding:10px 18px;font-size:14px;color:var(--dim);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;display:flex;align-items:center;gap:8px}
#term-tabs .tt.active{color:var(--accent);border-bottom-color:var(--accent)}
#term-tabs .tt .close{font-size:12px;opacity:.5;padding:4px}
#term-tabs .tt .close:hover{opacity:1;color:var(--red)}
#term-tabs .tt-add{padding:10px 14px;font-size:18px;color:var(--dim);cursor:pointer}
#term-tabs .tt-add:hover{color:var(--accent)}
#term-tabs .tt-clear{margin-left:auto;padding:10px 14px;font-size:12px;color:var(--red);cursor:pointer;opacity:.6}
#term-tabs .tt-clear:hover{opacity:1}
#extra-keys{display:none;background:#020817;flex-shrink:0;touch-action:manipulation;position:fixed;bottom:0;left:0;right:0;z-index:50}
@media (hover:none) and (pointer:coarse){#extra-keys{display:flex}}
#extra-keys .ek{flex:1;text-align:center;padding:10px 0;font-size:12px;font-family:monospace;color:#f8fafc;background:#0f1729;margin-right:1px;cursor:pointer;user-select:none;-webkit-user-select:none;transition:background .1s}
#extra-keys .ek:last-child{margin-right:0}
#extra-keys .ek:active{background:#1e293b}
#extra-keys .ek.armed{background:#1a3a1a;color:#88ff88}
#extra-keys .ek.locked{background:#3a1a1a;color:#ff8888}
#term-box{flex:1;overflow:hidden;min-height:0;-webkit-touch-callout:none;position:relative}
@media (hover:none) and (pointer:coarse){
  #term-box .xterm-viewport{overflow-y:auto!important;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-right:60px}
  #term-box .xterm-viewport::-webkit-scrollbar{display:none}
}
@media (hover:none) and (pointer:coarse){#term-box{margin-bottom:36px}}
.btn-icon{background:none;border:1px solid var(--border);color:var(--dim);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:12px}
.btn-icon:hover{color:var(--text);border-color:var(--dim)}
</style>
</head>
<body>
<div class="hdr">
  <div style="display:flex;align-items:center">
    <h1>Drop <small style="font-size:10px;color:#666">v31</small></h1>
    <div class="tabs">
      <div class="tab active" onclick="switchTab('drop')">Files</div>
      <div class="tab" onclick="switchTab('term')">Terminal</div>
      <div class="tab" onclick="switchTab('browser')">Browser</div>
    </div>
  </div>
  <div class="hdr-right">
    <span class="count" id="count"></span>
    <button onclick="refresh()" class="btn-icon" title="Refresh">↻</button>
    <button onclick="showCreds()" class="btn-icon">⚙</button>
  </div>
</div>

<div class="panel active" id="drop-panel">
<div class="inner">
<div class="drop" id="drop" onclick="document.getElementById('fi').click()">
  Drop files here or tap to upload
  <input type="file" id="fi" multiple>
  <div class="bar" id="bar"><div class="fill" id="fill"></div></div>
</div>
<div class="grid" id="grid"></div>
</div>
</div>

<div class="panel" id="term-panel">
<div id="term-tabs"><span class="tt-add" onclick="newTermTab()">＋</span><span class="tt-clear" onclick="clearAllSessions()">✕ Clear</span></div>
<div id="term-box"></div>
<div id="extra-keys"></div>
</div>

<div class="panel" id="browser-panel" style="flex-direction:column">
<div style="display:flex;align-items:center;gap:4px;padding:4px 8px;background:#161b22;border-bottom:1px solid #30363d;flex-shrink:0">
  <button onclick="brSend({action:'back'})" style="background:#21262d;border:1px solid #30363d;color:#e6edf3;border-radius:4px;padding:4px 8px;cursor:pointer;font-size:13px">◀</button>
  <button onclick="brSend({action:'forward'})" style="background:#21262d;border:1px solid #30363d;color:#e6edf3;border-radius:4px;padding:4px 8px;cursor:pointer;font-size:13px">▶</button>
  <button onclick="brSend({action:'reload'})" style="background:#21262d;border:1px solid #30363d;color:#e6edf3;border-radius:4px;padding:4px 8px;cursor:pointer;font-size:13px">↻</button>
  <input id="br-url" type="text" placeholder="URL..." onkeydown="if(event.key==='Enter')brSend({action:'navigate',url:this.value})" style="flex:1;background:#0d1117;border:1px solid #30363d;color:#e6edf3;border-radius:4px;padding:4px 8px;font-size:13px;outline:none">
  <button onclick="brToggleKbd(this)" id="br-kbd-btn" style="background:#21262d;border:1px solid #30363d;color:#e6edf3;border-radius:4px;padding:4px 8px;cursor:pointer;font-size:13px">⌨</button>
  <button onclick="brZoom(1.25)" style="background:#21262d;border:1px solid #30363d;color:#e6edf3;border-radius:4px;padding:4px 8px;cursor:pointer;font-size:13px">+</button>
  <button onclick="brZoom(0.8)" style="background:#21262d;border:1px solid #30363d;color:#e6edf3;border-radius:4px;padding:4px 8px;cursor:pointer;font-size:13px">−</button>
  <button onclick="brScale=1;brApply()" style="background:#21262d;border:1px solid #30363d;color:#e6edf3;border-radius:4px;padding:4px 8px;cursor:pointer;font-size:13px">1:1</button>
  <button onclick="brFit()" style="background:#21262d;border:1px solid #30363d;color:#e6edf3;border-radius:4px;padding:4px 8px;cursor:pointer;font-size:13px">Fit</button>
</div>
<div style="flex:1;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#000;position:relative" id="br-wrap">
  <canvas id="br-canvas" width="1280" height="720" style="cursor:default"></canvas>
  <input id="br-kbd-input" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" style="position:fixed;top:-100px;left:0;width:1px;height:1px;opacity:0;pointer-events:none">
  <div style="position:absolute;bottom:4px;left:8px;font-size:11px;color:#8b949e" id="br-status">Connecting...</div>
</div>
</div>

<div class="lightbox" id="lb" onclick="this.classList.remove('on')"><img id="lbi"></div>
<div id="credModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:100;align-items:center;justify-content:center">
<div style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;width:90%;max-width:340px">
<h3 style="margin-bottom:12px;color:var(--accent)">Credentials</h3>
<label for="cUser" style="font-size:11px;color:var(--dim)">Username</label>
<input id="cUser" style="width:100%;margin-bottom:8px;padding:8px;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:6px">
<label for="cPass" style="font-size:11px;color:var(--dim)">New Password</label>
<input id="cPass" type="password" style="width:100%;margin-bottom:12px;padding:8px;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:6px">
<div style="display:flex;gap:8px;justify-content:flex-end">
<button onclick="saveCreds()" style="background:var(--green);color:#000;border:none;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12px">Save</button>
<button onclick="document.getElementById('credModal').style.display='none'" style="background:var(--border);color:var(--text);border:none;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12px">Cancel</button>
</div></div></div>
<div class="toast" id="toast"></div>

<script src="/static/xterm.min.js"></script>
<script src="/static/addon-fit.min.js"></script>
<script src="/static/addon-web-links.min.js"></script>
<script src="/static/touchsel.js?v=6"></script>
<script>
const F=(u,o)=>fetch(u,{...o});
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500)}
function fmt(b){if(b<1024)return b+'B';if(b<1048576)return(b/1024).toFixed(1)+'KB';return(b/1048576).toFixed(1)+'MB'}
function ext(n){const i=n.lastIndexOf('.');return i>0?n.slice(i+1).toUpperCase():'?'}

// Terminal - multi-session tabs
let termInit=false;
const isMobile=matchMedia('(hover:none) and (pointer:coarse)').matches||('ontouchstart' in window);
const termSessions={};  // id -> {term, fit, ws, el, retries, scrollTimer, hbInterval, lastPong, tabEl}
let activeSessionId=null;

function switchTab(name){
  document.querySelectorAll('.tab').forEach(t=>{const n=t.textContent.trim();t.classList.toggle('active',(name==='drop'&&n==='Files')||(name==='term'&&n==='Terminal')||(name==='browser'&&n==='Browser'))});
  document.getElementById('drop-panel').classList.toggle('active',name==='drop');
  document.getElementById('term-panel').classList.toggle('active',name==='term');
  document.getElementById('browser-panel').classList.toggle('active',name==='browser');
  if(name==='term'){
    if(!termInit){termInit=true;initExtraKeys();setupViewport();newTermTab()}
    const s=termSessions[activeSessionId];
    if(s&&s.fit)setTimeout(()=>{try{s.fit.fit()}catch(e){}},100);
  }
  if(name==='browser')setTimeout(brFit,50);
}

async function newTermTab(){
  const r=await(await F('/ws/term?action=new')).json();
  const id=r.id;
  const el=document.createElement('div');
  el.style.cssText='position:absolute;top:0;left:0;right:0;bottom:0;display:none';
  document.getElementById('term-box').appendChild(el);

  const t=new Terminal({cursorBlink:true,fontSize:14,scrollback:5000,tabStopWidth:4,fontFamily:'Menlo,Monaco,Consolas,monospace',fontWeightBold:'normal',allowProposedApi:true,theme:{background:'#0d1117',foreground:'#dcdcdc'}});
  const f=new FitAddon.FitAddon();
  t.loadAddon(f);
  t.loadAddon(new WebLinksAddon.WebLinksAddon());
  t.open(el);

  if(isMobile){
    new TerminalTouchSelection(t,el,{
      onCopy:()=>toast('Copied'),
      onPaste:text=>{const s=termSessions[id];if(s&&s.ws&&s.ws.readyState===1){const e=new TextEncoder().encode(text);const buf=new Uint8Array(1+e.length);buf[0]=0x01;buf.set(e,1);s.ws.send(buf)}}
    });
  }

  t.onData(d=>{const s=termSessions[id];if(s&&s.ws&&s.ws.readyState===1){const e=new TextEncoder().encode(d);const buf=new Uint8Array(1+e.length);buf[0]=0x01;buf.set(e,1);s.ws.send(buf)}});
  let resizeTimer;
  t.onResize(({cols,rows})=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{const s=termSessions[id];if(s&&s.ws&&s.ws.readyState===1){const buf=new Uint8Array(5);buf[0]=0x04;buf[1]=cols>>8;buf[2]=cols&0xff;buf[3]=rows>>8;buf[4]=rows&0xff;s.ws.send(buf)}},150)});
  t.attachCustomKeyEventHandler(e=>{
    if(e.type==='keydown'&&e.ctrlKey&&!e.shiftKey&&e.key==='c'&&t.hasSelection()){navigator.clipboard.writeText(t.getSelection());t.clearSelection();return false}
    if(e.type==='keydown'&&e.ctrlKey&&e.shiftKey&&e.key==='V'){navigator.clipboard.readText().then(text=>{const s=termSessions[id];if(s&&s.ws&&s.ws.readyState===1){const e=new TextEncoder().encode(text);const buf=new Uint8Array(1+e.length);buf[0]=0x01;buf.set(e,1);s.ws.send(buf)}});return false}
    return true;
  });

  // Tab element
  const tabEl=document.createElement('span');
  tabEl.className='tt';
  tabEl.innerHTML='Shell '+id+' <span class="close" onclick="event.stopPropagation();closeTermTab(\''+id+'\')">✕</span>';
  tabEl.onclick=()=>activateTab(id);
  const addBtn=document.querySelector('.tt-add');
  addBtn.parentNode.insertBefore(tabEl,addBtn);

  termSessions[id]={term:t,fit:f,ws:null,el,retries:0,scrollTimer:null,hbInterval:null,lastPong:0,tabEl};
  activateTab(id);
  connectSession(id);
}

function activateTab(id){
  if(activeSessionId===id)return;
  // Hide current
  if(activeSessionId&&termSessions[activeSessionId]){
    termSessions[activeSessionId].el.style.display='none';
    termSessions[activeSessionId].tabEl.classList.remove('active');
  }
  activeSessionId=id;
  const s=termSessions[id];
  if(!s)return;
  s.el.style.display='block';
  s.tabEl.classList.add('active');
  setTimeout(()=>{try{s.fit.fit()}catch(e){}s.term.focus()},50);
}

function clearAllSessions(){
  const n=Object.keys(termSessions).length;
  if(!n){toast('No sessions');return}
  if(!confirm('Close all '+n+' terminal session'+(n>1?'s':'')+'? This will kill all running processes.'))return;
  Object.keys(termSessions).forEach(id=>closeTermTab(id));
  F('/ws/term?action=reset');
  toast('All sessions cleared');
}
function closeTermTab(id){
  const s=termSessions[id];
  if(!s)return;
  if(s.ws){s.ws.onclose=null;try{s.ws.close()}catch(e){}}
  clearInterval(s.hbInterval);
  s.term.dispose();
  s.el.remove();
  s.tabEl.remove();
  F('/ws/term?action=close&id='+id);
  delete termSessions[id];
  if(activeSessionId===id){
    activeSessionId=null;
    const ids=Object.keys(termSessions);
    if(ids.length)activateTab(ids[ids.length-1]);
  }
}

function connectSession(id){
  const s=termSessions[id];
  if(!s)return;
  if(s.ws){try{s.ws.onclose=null;s.ws.close()}catch(e){}}
  const proto=location.protocol==='https:'?'wss:':'ws:';
  const ws=new WebSocket(proto+'//'+location.host+'/ws/term?id='+id);
  ws.binaryType='arraybuffer';
  s.ws=ws;
  ws.onopen=()=>{
    s.retries=0;s.term.reset();
    try{s.fit.fit()}catch(e){}
    const buf=new Uint8Array(5);buf[0]=0x04;buf[1]=s.term.cols>>8;buf[2]=s.term.cols&0xff;buf[3]=s.term.rows>>8;buf[4]=s.term.rows&0xff;
    ws.send(buf);
    s.lastPong=Date.now();
    s.hbInterval=setInterval(()=>{if(Date.now()-s.lastPong>60000){ws.close();return}if(ws.readyState===1)ws.send(new Uint8Array([0x07]))},25000);
    setTimeout(()=>s.term.scrollToBottom(),500);
  };
  ws.onmessage=e=>{
    const d=new Uint8Array(e.data);
    if(d[0]===0x01){s.term.write(d.subarray(1));clearTimeout(s.scrollTimer);s.scrollTimer=setTimeout(()=>s.term.scrollToBottom(),200)}
    else if(d[0]===0x07)s.lastPong=Date.now();
  };
  ws.onclose=()=>{clearInterval(s.hbInterval);reconnectSession(id)};
  ws.onerror=()=>{};
}

function reconnectSession(id){
  const s=termSessions[id];
  if(!s)return;
  if(s.retries===0)s.term.write('\r\n\x1b[31m[reconnecting');
  if(s.retries>=20){s.term.write(' gave up]\x1b[0m\r\n');return}
  s.retries++;
  s.term.write('.');
  setTimeout(()=>connectSession(id),Math.min(s.retries*1000,10000));
}

function resize(){
  const s=termSessions[activeSessionId];
  if(s&&s.fit)try{s.fit.fit()}catch(e){}
}
window.addEventListener('resize',resize);
new ResizeObserver(()=>{if(document.getElementById('term-panel').classList.contains('active'))resize()}).observe(document.getElementById('term-box'));

// Files
let currentPath='';
async function load(){
  const url=currentPath?'/api/files?path='+encodeURIComponent(currentPath):'/api/files';
  const files=await(await F(url)).json();
  document.getElementById('count').textContent=files.length+' items'+(currentPath?' · '+currentPath:'');
  const g=document.getElementById('grid');
  if(!files.length&&!currentPath){g.innerHTML='<div class="empty">No files yet</div>';return}
  let html='';
  if(currentPath){html+=`<div class="item" onclick="nav('')" style="cursor:pointer"><div class="placeholder">⬆</div><div class="info"><div class="name">.. back</div><div class="meta">Parent directory</div></div></div>`}
  html+=files.map(f=>{
    if(f.isDir){return`<div class="item" onclick="nav('${(currentPath?currentPath+'/':'')+f.name}')" style="cursor:pointer"><div class="placeholder">📁</div><div class="info"><div class="name">${f.name}</div><div class="meta">Folder</div></div><button class="del" onclick="event.stopPropagation();delDir('${(currentPath?currentPath+'/':'')+f.name}')">✕</button></div>`}
    const fpath=currentPath?currentPath+'/'+f.name:f.name;
    const thumb=f.isImage?`<img src="/api/files/${encodeURIComponent(fpath)}" loading="lazy" onclick="view('${fpath.replace(/'/g,"\\'")}')">`:`<div class="placeholder">${ext(f.name)}</div>`;
    return`<div class="item">${thumb}<div class="info"><div class="name"><a href="/api/files/${encodeURIComponent(fpath)}" style="color:inherit;text-decoration:none" title="${f.name}">${f.name}</a></div><div class="meta">${fmt(f.size)} · ${new Date(f.modTime).toLocaleDateString()}</div></div><button class="share" onclick="share('${fpath.replace(/'/g,"\\'")}')">🔗</button><a class="dl" href="/api/files/${encodeURIComponent(fpath)}" download="${f.name}">⬇</a><button class="del" onclick="del('${fpath.replace(/'/g,"\\'")}')">✕</button></div>`}).join('');
  g.innerHTML=html;
}
function nav(p){currentPath=p;load()}
async function share(path){const r=await(await F('/api/shares',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path})})).json();if(r.url){const url=location.origin+r.url;await navigator.clipboard.writeText(url).catch(()=>{});toast('Link copied: '+url)}else{toast('Error: '+(r.error||'unknown'))}}
function view(name){document.getElementById('lbi').src='/api/files/'+encodeURIComponent(name);document.getElementById('lb').classList.add('on')}
async function del(name){if(!confirm('Delete '+name+'?'))return;await F('/api/files/'+encodeURIComponent(name),{method:'DELETE'});toast('Deleted');load()}
async function delDir(name){if(!confirm('Delete folder '+name+' and all contents?'))return;await F('/api/files/'+encodeURIComponent(name),{method:'DELETE'});toast('Deleted');load()}
async function upload(files){
  const bar=document.getElementById('bar'),fill=document.getElementById('fill');
  bar.classList.add('active');
  for(let i=0;i<files.length;i++){fill.style.width=((i/files.length)*100)+'%';const fd=new FormData();fd.append('file',files[i]);if(currentPath)fd.append('path',currentPath);await F('/api/files',{method:'POST',body:fd})}
  fill.style.width='100%';setTimeout(()=>{bar.classList.remove('active');fill.style.width='0'},500);
  toast(files.length+' file'+(files.length>1?'s':'')+' uploaded');load();
}
const drop=document.getElementById('drop');
drop.ondragover=e=>{e.preventDefault();drop.classList.add('over')};
drop.ondragleave=()=>drop.classList.remove('over');
drop.ondrop=e=>{e.preventDefault();drop.classList.remove('over');upload(e.dataTransfer.files)};
document.getElementById('fi').onchange=e=>upload(e.target.files);

async function showCreds(){const r=await(await F('/api/creds')).json();document.getElementById('cUser').value=r.user||'';document.getElementById('cPass').value='';document.getElementById('credModal').style.display='flex'}
async function saveCreds(){const user=document.getElementById('cUser').value.trim(),pass=document.getElementById('cPass').value;if(!user||!pass){toast('Both fields required');return}await F('/api/creds',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user,pass})});document.getElementById('credModal').style.display='none';toast('Credentials updated — re-login required')}

function refresh(){
  if(document.getElementById('drop-panel').classList.contains('active'))load();
  else if(activeSessionId&&termSessions[activeSessionId]){const s=termSessions[activeSessionId];s.term.clear();connectSession(activeSessionId)}
}

// Extra keys
const ekDef=[
  {l:'ESC',seq:'\x1b'},{l:'TAB',seq:'\t'},{l:'CTRL',mod:true},{l:'ALT',mod:true},
  {l:'↑',seq:'\x1b[A'},{l:'↓',seq:'\x1b[B'},{l:'←',seq:'\x1b[D'},{l:'→',seq:'\x1b[C'},
  {l:'HOME',seq:'\x1b[H'},{l:'END',seq:'\x1b[F'},{l:'DEL',seq:'\x1b[3~'}
];
const ekState={CTRL:0,ALT:0};
function initExtraKeys(){
  const bar=document.getElementById('extra-keys');
  ekDef.forEach(k=>{
    const el=document.createElement('div');
    el.className='ek';el.textContent=k.l;el.dataset.key=k.l;
    if(k.mod){
      el.addEventListener('click',()=>{
        ekState[k.l]=(ekState[k.l]+1)%3;
        el.className='ek'+(ekState[k.l]===1?' armed':ekState[k.l]===2?' locked':'');
      });
    }else{
      el.addEventListener('click',()=>{
        el.style.background='#1e293b';setTimeout(()=>el.style.background='',120);
        sendEk(k.seq);
      });
    }
    bar.appendChild(el);
  });
}
function sendEk(seq){
  const s=termSessions[activeSessionId];
  if(!s||!s.ws||s.ws.readyState!==1)return;
  let data=seq;
  if(ekState.ALT&&seq.length===1)data='\x1b'+seq;
  if(ekState.CTRL&&seq.length===1){const c=seq.toLowerCase().charCodeAt(0)-96;if(c>0&&c<27)data=String.fromCharCode(c)}
  const e=new TextEncoder().encode(data);
  const buf=new Uint8Array(1+e.length);buf[0]=0x01;buf.set(e,1);s.ws.send(buf);
  ['CTRL','ALT'].forEach(m=>{if(ekState[m]===1){ekState[m]=0;document.querySelector(`.ek[data-key="${m}"]`).className='ek'}});
  s.term.focus();
}
function setupViewport(){
if(isMobile&&window.visualViewport){
  const ek=document.getElementById('extra-keys');
  const reposKeys=()=>{
    const off=window.innerHeight-visualViewport.height-visualViewport.offsetTop;
    ek.style.bottom=Math.max(0,off)+'px';
    document.body.style.height=visualViewport.height+'px';
    if(activeSessionId&&termSessions[activeSessionId])try{termSessions[activeSessionId].fit.fit()}catch(e){}
  };
  visualViewport.addEventListener('resize',reposKeys);
  visualViewport.addEventListener('scroll',reposKeys);
}
}

load();
document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.shiftKey&&(e.key==='I'||e.key==='J'))e.preventDefault();if(e.key==='F12')e.preventDefault()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('/static/sw.js?v=2');
</script>
<script>
let brWs,brScale=1,brKbd=false,brW=1280,brH=720;
const brCanvas=document.getElementById("br-canvas"),brCtx=brCanvas.getContext("2d");
function brConnect(){
  const p=location.protocol==="https:"?"wss:":"ws:";
  brWs=new WebSocket(p+"//"+location.host+"/browser/ws");
  brWs.binaryType="arraybuffer";
  brWs.onopen=()=>{document.getElementById("br-status").textContent="Connected";brSend({action:"geturl"})};
  brWs.onmessage=e=>{
    if(typeof e.data==="string"){const m=JSON.parse(e.data);if(m.url)document.getElementById("br-url").value=m.url}
    else{const img=new Image();img.onload=()=>{if(img.width!==brW||img.height!==brH){brW=img.width;brH=img.height;brCanvas.width=brW;brCanvas.height=brH;brApply()}brCtx.drawImage(img,0,0);URL.revokeObjectURL(img.src)};img.onerror=()=>{document.getElementById("br-status").textContent="Frame decode error"};img.src=URL.createObjectURL(new Blob([e.data],{type:"image/jpeg"}))}
  };
  brWs.onclose=()=>{document.getElementById("br-status").textContent="Reconnecting...";setTimeout(brConnect,2000)};
}
function toggleBrKbd(){brKbd=!brKbd}
function brToggleKbd(btn){brKbd=!brKbd;btn.style.background=brKbd?'#1f6feb':'#21262d';const inp=document.getElementById('br-kbd-input');if(brKbd){inp.style.pointerEvents='auto';inp.focus()}else{inp.blur();inp.style.pointerEvents='none'}}
document.getElementById('br-kbd-input').addEventListener('input',e=>{if(e.inputType==='insertLineBreak'||e.inputType==='insertParagraph'){brSend({action:'keydown',key:'Enter',keyCode:13})}else if(e.data){brSend({action:'type',text:e.data})}e.target.value='';});
document.getElementById('br-kbd-input').addEventListener('keydown',e=>{const keys=['Backspace','Enter','Tab','Escape','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'];if(keys.includes(e.key)){e.preventDefault();brSend({action:'keydown',key:e.key,keyCode:e.keyCode})}});
function brSend(m){
  if(brWs&&brWs.readyState===1)brWs.send(JSON.stringify(m));
  // Report actions to chat
  const reportActions=['click','scroll','navigate','back','forward','reload','keydown','keyup','type'];
  if(reportActions.includes(m.action)){
    fetch('/browser/event',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(m)}).then(r=>r.json()).catch(()=>{});
  }
}
function brZoom(f){brScale=Math.max(0.25,Math.min(3,brScale*f));brApply()}
function brApply(){brCanvas.style.width=(brW*brScale)+"px";brCanvas.style.height=(brH*brScale)+"px"}
function brFit(){const wr=document.getElementById("br-wrap").getBoundingClientRect();brScale=Math.min(wr.width/brW,wr.height/brH,1);brApply()}
function brXY(e){const r=brCanvas.getBoundingClientRect();const sx=brW/r.width,sy=brH/r.height;return{x:(e.clientX-r.left)*sx,y:(e.clientY-r.top)*sy}}
brCanvas.addEventListener("mousedown",e=>{e.preventDefault();const p=brXY(e);brSend({action:"click",x:p.x,y:p.y,button:["left","middle","right"][e.button]})});
brCanvas.addEventListener("wheel",e=>{e.preventDefault();const p=brXY(e);brSend({action:"scroll",x:p.x,y:p.y,deltaX:e.deltaX,deltaY:e.deltaY})},{passive:false});
let brLastTouch=null,brTouchMoved=false,brTwoFinger=false,brTouchStart=null;
function brTXY(t){const r=brCanvas.getBoundingClientRect();return{x:(t.clientX-r.left)*(brW/r.width),y:(t.clientY-r.top)*(brH/r.height)}}
brCanvas.addEventListener("touchstart",e=>{e.preventDefault();brTouchMoved=false;brTwoFinger=e.touches.length>1;brLastTouch=brTXY(e.touches[0]);brTouchStart={x:brLastTouch.x,y:brLastTouch.y};const inp=document.getElementById('br-kbd-input');if(document.activeElement===inp){inp.blur();inp.style.pointerEvents='none';brKbd=false;document.getElementById('br-kbd-btn').style.background='#21262d'}},{passive:false});
brCanvas.addEventListener("touchmove",e=>{e.preventDefault();if(e.touches.length>=2)brTwoFinger=true;const p=brTXY(e.touches[0]);if(brTouchStart){const dx=p.x-brTouchStart.x,dy=p.y-brTouchStart.y;if(dx*dx+dy*dy>100)brTouchMoved=true}if(brTouchMoved&&brLastTouch){brSend({action:"scroll",x:brLastTouch.x,y:brLastTouch.y,deltaX:(brLastTouch.x-p.x)*2,deltaY:(brLastTouch.y-p.y)*2})}brLastTouch=p},{passive:false});
brCanvas.addEventListener("touchend",e=>{e.preventDefault();if(!brTouchMoved&&!brTwoFinger&&brLastTouch){brSend({action:"click",x:brLastTouch.x,y:brLastTouch.y,button:"left"})}brTwoFinger=false;brLastTouch=null;brTouchStart=null},{passive:false});
document.addEventListener("keydown",e=>{if(!brKbd||e.target.tagName==="INPUT"||!document.getElementById("browser-panel").classList.contains("active"))return;e.preventDefault();if(e.key.length===1)brSend({action:"type",text:e.key});else brSend({action:"keydown",key:e.key,keyCode:e.keyCode})});
document.addEventListener("keyup",e=>{if(!brKbd||e.target.tagName==="INPUT"||!document.getElementById("browser-panel").classList.contains("active"))return;e.preventDefault();if(e.key.length>1)brSend({action:"keyup",key:e.key,keyCode:e.keyCode})});
brConnect();
brFit();
window.addEventListener("resize",()=>{if(document.getElementById("browser-panel").classList.contains("active"))brFit()});
screen.orientation&&screen.orientation.addEventListener("change",()=>setTimeout(brFit,100));
</script>
</body>
